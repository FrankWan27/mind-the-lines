name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      # builds shared, type-checks the server (tsc --noEmit),
      # then type-checks and production-builds the client (tsc && vite build)
      - run: npm run build
